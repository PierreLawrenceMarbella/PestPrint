<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PestPrint</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-success">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                PestPrint
            </span>

        </div>

    </nav>


    <!-- Main content -->
    <main class="container">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h1 class="card-title">
                            Rice Pest Identification
                        </h1>

                        <p class="text-muted">
                            Upload an image of a rice plant
                            or rice leaf to identify the
                            likely damage class.
                        </p>


                        <!-- Upload form -->
                        <form
                            method="POST"
                            enctype="multipart/form-data"
                        >

                            <div class="mb-3">

                                <label
                                    for="image"
                                    class="form-label"
                                >
                                    Select Rice Image
                                </label>

                                <input
                                    class="form-control"
                                    type="file"
                                    id="image"
                                    name="image"
                                    accept="image/*"
                                    required
                                >

                            </div>


                            <!-- Image preview -->
                            <div
                                id="preview-container"
                                class="mb-3"
                            >

                                <img
                                    id="preview"
                                    src="#"
                                    alt="Image preview"
                                >

                            </div>


                            <button
                                type="submit"
                                class="btn btn-success btn-lg w-100"
                            >
                                Analyze Image
                            </button>

                        </form>


                        <!-- Error -->
                        {% if error %}

                        <div
                            class="alert alert-danger mt-4"
                        >
                            {{ error }}
                        </div>

                        {% endif %}


                        <!-- Prediction result -->
                        {% if prediction %}

                        <div
                            class="result-card mt-4"
                        >

                            <h2>
                                Prediction
                            </h2>

                            <div class="prediction">

                                {{ prediction
                                |replace("_", " ")
                                |title }}

                            </div>

                            <p class="confidence">

                                Confidence:
                                {{ "%.2f"|format(confidence) }}%

                            </p>

                        </div>

                        {% endif %}

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script>

        const imageInput =
            document.getElementById("image");

        const preview =
            document.getElementById("preview");

        const previewContainer =
            document.getElementById(
                "preview-container"
            );


        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];

                if (file) {

                    const reader =
                        new FileReader();

                    reader.onload =
                        function (event) {

                            preview.src =
                                event.target.result;

                            previewContainer.style.display =
                                "block";

                        };

                    reader.readAsDataURL(file);

                }

            }
        );

    </script>

</body>

</html>
